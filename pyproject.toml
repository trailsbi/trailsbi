[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trailsbi"
dynamic = ["version"]
description = "End-to-end data lineage, model health and AI readiness for Power BI projects (PBIP). Runs offline."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "TrailsBI" }]
keywords = ["power bi", "pbip", "pbir", "tmdl", "lineage", "best practice analyzer", "copilot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Documentation",
]
dependencies = []

[project.urls]
Homepage = "https://trailsbi.com"
Source = "https://github.com/trailsbi/trailsbi"
Issues = "https://github.com/trailsbi/trailsbi/issues"

[project.scripts]
trailsbi = "trailsbi.cli:main"

[tool.setuptools.dynamic]
version = { attr = "trailsbi.brand.VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trailsbi = ["web/*.html", "web/*.css", "web/js/*.js"]

[tool.ruff]
line-length = 110
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "RET", "PL"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",  # rule tables and parsers are long by nature
    "PLW0603",
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
# Rule tables, icon paths and the logo are long strings by nature.
"src/trailsbi/{ai_readiness,bpa,brand,icons}.py" = ["E501"]
"tests/*" = ["PLC0415"]

[tool.pytest.ini_options]
testpaths = ["tests"]
